# Experiment generator, scheduled two-stage vd training (round 2).
#
# Every parameter is PINNED to the value observed in the 13/13 best runs
# (~/shared/Research/VDSDS/meshup_run_2/0Close). Only two axes remain open:
# the new phase schedules and what 0Close itself spread over (jitter range,
# prompt). Deliberately NOT sampled again: failed-range values from earlier
# rounds (lr 0.001, 1000-epoch budgets, loss.jacobian 500, view_dependence
# 0/500 corners, pi/8 jitter, the 'human' prompt).
#
# Steps: experiments/multi_gen.py --force_duplicate produces duplicated
# 1-concept prompt pairs ("Rabbit", "Rabbit") = 0Close's kernel.
#
# Launch (fresh dir; do NOT reuse round-1's meshup_sched):
#   python experiments/multi_gen.py \
#     --run_dir <shared>/VDSDS/meshup_sched_2 \
#     --models_dir /home/tpesch/shared/3D/models/vdsds \
#     --model_pattern "*.glb" \
#     --overrides experiments/schedule_gen.yaml \
#     --num_runs 64 \
#     --force_duplicate
#
# Analysis: experiments/analyze_runs.py --ignore path. over the run_dir;
# schedule presets match atomically.

# 2 prompts / 2 default anchors, duplicated 1:1 per run.
num_prompts: 2

# ------------------ Pinned best recipe (13/13 in 0Close) ------------------

optim.epochs:
  - "1500"
optim.lr:
  - "0.0025"
optim.seed:
  - "8888"

# Weight-space prior OFF (9/13 Close; 500.0 owns 82% of 0Nothing).
loss.jacobian:
  - "0.0"

# Identity pull at the rendered view directions: parity balance value,
# most common in Close and mildly Close-positive in the analysis.
loss.composed_jacobian:
  - "500.0"

# vd-basis flattening: most frequent value in Close runs (5/13).
loss.view_dependence:
  - "1500.0"
  - "3000.0"
  - "5000.0"

# ------------------ The schedule axis (1500 epochs total) -----------------

# Phases: profile 'meshup' = hard shading + cosine light (Close shader);
# profile 'legacy' = soft shading + camera light + crop fit (detail stage).
# step_mode 'meshup' = stale-graph large-scale stepping;
# 'accum' = batch-mean detailed stepping (13/13 Close).
#
# Presets:
#   c1  control    = exact 0Close recipe (accum + hard, no switch)
#   c2  control    = pure meshup regime (comparison to parity baselines)
#   s1-s4          = meshup early -> legacy detail late, switch point swept
#   i1  step-only  = batch scheme swaps mid-run, shading stays hard
#   i2  shade-only = shading swaps mid-run, stepping stays meshup
schedule:
  - '[{"epochs": 1500, "profile": "meshup", "optim.step_mode": "accum"}]'
  - '[{"epochs": 1500, "profile": "meshup", "optim.step_mode": "meshup"}]'
  - '[{"epochs": 300, "profile": "meshup", "optim.step_mode": "meshup"}, {"epochs": 1200, "profile": "legacy", "optim.step_mode": "accum"}]'
  - '[{"epochs": 600, "profile": "meshup", "optim.step_mode": "meshup"}, {"epochs": 900, "profile": "legacy", "optim.step_mode": "accum"}]'
  - '[{"epochs": 900, "profile": "meshup", "optim.step_mode": "meshup"}, {"epochs": 600, "profile": "legacy", "optim.step_mode": "accum"}]'
  - '[{"epochs": 1200, "profile": "meshup", "optim.step_mode": "meshup"}, {"epochs": 300, "profile": "legacy", "optim.step_mode": "accum"}]'
  - '[{"epochs": 500, "profile": "meshup", "optim.step_mode": "meshup"}, {"epochs": 1000, "profile": "meshup", "optim.step_mode": "accum"}]'
  - '[{"epochs": 600, "profile": "meshup", "optim.step_mode": "meshup"}, {"epochs": 900, "profile": "legacy", "optim.step_mode": "meshup"}]'

# ------------------ Secondary axes from 0Close's own spread ---------------

# Close's jitter values only (pi/4 x5, 2.25 x5, pi/2 x3). pi/8 excluded:
# 0 hits in Close, 43% of 0Crazy.
camera.jitter_range:
  - "0.7853981633974483"
  - "1.5707963267948966"
camera.aug_views:
  - "0"
camera.force_deformation_alignment:
  - "false"

# Close prompts, weighted by how they appeared in the best bucket.
# Rabbit owned 6/13; the others split the remaining runs evenly.
prompts:
  - "Dog"
  - "Moose"
  - "Cat"
  - "Hippo"
  - "Horse"

prompt.extra:
  - ""
  - "4k, realistic, unreal engine"

# ------------------ Output bookkeeping (0Close parity) --------------------

log.print:
  - "false"
log.save:
  - "true"
window.view:
  - "false"
window.close_on_finish:
  - "false"
post.analyze:
  - "false"
